; Scale by changing numprocs, more workers than subscriptions add no throughput.
; Run examples/setup.php once per deployment while the workers are stopped: Old workers would set new subscriptions to DETACHED.
[program:subscription-worker]
command=php /app/examples/worker.php
process_name=%(program_name)s_%(process_num)02d
numprocs=4
autorestart=true
; a worker exits regularly on maxRuntime and memoryLimit, and with an error after 5 minutes without a database
startsecs=5
stopsignal=TERM
; has to exceed the worst-case batch of your handlers
stopwaitsecs=60
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
