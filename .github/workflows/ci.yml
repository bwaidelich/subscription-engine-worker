name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pcntl, posix, pdo_pgsql

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress

      - name: Run coding standards
        run: composer run-script test:cs

      - name: Run static code analysis
        run: composer run-script test:phpstan

  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version:
          - '8.3'
          - '8.4'
          - '8.5'

    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pcntl, posix, pdo_pgsql

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start database
        run: docker run -d -e POSTGRES_PASSWORD=test -e POSTGRES_DB=test -p 127.0.0.1:5432:5432 --health-cmd "pg_isready -U postgres" --health-interval 1s --name postgres postgres:17

      - name: Wait for database
        run: until [ "$(docker inspect -f '{{.State.Health.Status}}' postgres)" = "healthy" ]; do sleep 1; done

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress

      - name: Run tests
        run: composer run-script test:phpunit
        env:
          TEST_DATABASE_DSN: pdo-pgsql://postgres:test@127.0.0.1:5432/test
